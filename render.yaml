services:
  - type: web
    name: distributed-task-scheduler
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/coordinator/Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GRPC_PORT
        value: "9090"
      - key: SCHEDULER_HEARTBEAT_TIMEOUT_SECONDS
        value: "15"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: pserv
    name: distributed-task-scheduler-worker
    runtime: docker
    plan: starter
    dockerContext: .
    dockerfilePath: ./backend/worker/Dockerfile
    autoDeploy: true
    envVars:
      - key: COORDINATOR_HOST
        value: distributed-task-scheduler
      - key: COORDINATOR_GRPC_PORT
        value: "9090"
      - key: WORKER_ID
        value: worker-node-1
      - key: WORKER_HOSTNAME
        value: distributed-task-scheduler-worker
      - key: WORKER_PORT
        value: "9091"
      - key: WORKER_MAX_CONCURRENT_TASKS
        value: "5"
