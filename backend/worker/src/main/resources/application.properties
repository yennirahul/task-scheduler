spring.application.name=worker

worker.id=${WORKER_ID:worker-node-1}
worker.hostname=${WORKER_HOSTNAME:localhost}
worker.port=${WORKER_PORT:9091}
worker.max-concurrent-tasks=${WORKER_MAX_CONCURRENT_TASKS:5}
worker.supported-task-types=${WORKER_SUPPORTED_TASK_TYPES:LOGGING,ARITHMETIC,REPORT}

coordinator.host=${COORDINATOR_HOST:localhost}
coordinator.grpc-port=${COORDINATOR_GRPC_PORT:9090}

spring.threads.virtual.enabled=true
logging.level.com.example.worker=INFO
